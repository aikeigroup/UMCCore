name: Build

# Compile and package on every push/PR so breakage is caught early, and upload
# the built jar as a workflow artifact for easy download.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMCCore-jar
          path: target/UMCCore-*.jar
          if-no-files-found: error
