name: Build

# CI build for pull requests (and manual runs), so breakage is caught before
# merge. Pushes to main are handled by the Release workflow, which also builds —
# keeping build.yml off `push: main` avoids running two builds per push.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMCCore-jar
          path: target/UMCCore-*.jar
          if-no-files-found: error
