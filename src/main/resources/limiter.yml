# ==========================================================================
#  UMCCore — Mob Limiter (limiter.yml)
#  Cap the number of mobs per chunk (or radius) to prevent entity buildup.
#  Disable with modules.moblimiter: false in config.yml.
# ==========================================================================

# Scope of the limit: CHUNK (per 16x16 chunk) or RADIUS (per area around spawn).
mode: CHUNK

# Radius in blocks, used only when mode is RADIUS.
radius: 8

# Per-category limits (per chunk by default). Lower = fewer mobs = less AI load.
# These are tuned for busy servers; raise them if your gameplay needs denser
# mobs. When a spawn would exceed the limit it is cancelled (hard) or reduced
# (soft) — see enforcement below.
limits:
  hostile: 20
  passive: 15
  ambient: 8
  # Total cap across all categories (0 = no separate total cap).
  total: 35

# Which spawn sources the limiter applies to.
apply-to:
  natural: true
  spawner: true
  breeding: false
  other: false

enforcement:
  # HARD = cancel spawns over the limit. SOFT = probabilistically reduce them.
  type: HARD
  # For SOFT mode: chance (0.0-1.0) to cancel each over-limit spawn.
  soft-cancel-chance: 0.5

# Per-world overrides. Example:
# per-world:
#   world_the_end:
#     limits:
#       hostile: 60
per-world: {}

# Tell the nearest player when their spawn is blocked by a limit. Only fires for
# player-driven spawns (breeding, spawn eggs) so natural spawns don't spam.
notify:
  enabled: true
  # Where to show it: actionbar or chat.
  where: actionbar
