# ==========================================================================
#  Menu: guide  —  JAVA  (menus/java/guide.yml)
#  UNNESMC — Panduan Server (multi-halaman). Buka: /guide atau
#  /umccore menu guide.  Render sebagai Dialog native; body ber-ikon dipakai
#  agar tiap poin punya gambar item. Tombol « Prev / Next » otomatis.
#
#  Catatan: emoji dihindari (jadi kotak putus di font Java) — diganti ikon item
#  pada baris body & simbol « ✦ pada tombol. Konten & command tidak diubah.
#  Design system & palet: lihat header main.yml.
# ==========================================================================

title: "<gradient:#33d17a:#4dd0e1><bold>PANDUAN UNNESMC</bold></gradient>"
kind: MENU
type: AUTO
rows: 6

# ---- HALAMAN 0 — Selamat datang / daftar isi ------------------------------
body:
  - "<white>Halo <gradient:#33d17a:#4dd0e1><bold>%player_name%</bold></gradient><white>, selamat datang di"
  - "<gradient:#33d17a:#4dd0e1><bold>UNNES Minecraft Community</bold></gradient><#90a4ae> — wadah mahasiswa UNNES & pencinta Minecraft untuk mabar, bersantai, dan refreshing di sela tugas kuliah."
  - icon: COMPASS
    text: "<white>Java <#90a4ae>play.unnesmc.my.id  <#546e7a>•  <white>Bedrock <#90a4ae>...:19132"
  - head: "%player_name%"
    text: "<#90a4ae>Butuh bantuan? Ketik <#4dd0e1>/guide</#4dd0e1> kapan saja untuk buka panduan ini."

buttons:
  about:
    label: "<#4dd0e1><bold>Gamemode & Fitur</bold></#4dd0e1>"
    description: [ "<#90a4ae>Survival, cross-platform</#90a4ae>" ]
    icon: BEACON
    actions: [ "PAGE:1" ]
  start:
    label: "<gradient:#33d17a:#4dd0e1><bold>Cara Mulai</bold></gradient>"
    description: [ "<#90a4ae>Langkah pertama & masuk survival</#90a4ae>" ]
    icon: GRASS_BLOCK
    actions: [ "PAGE:2" ]
  features:
    label: "<#ffb300><bold>Fitur & Command</bold></#ffb300>"
    description: [ "<#90a4ae>Daftar fitur utama server</#90a4ae>" ]
    icon: NETHER_STAR
    actions: [ "PAGE:3" ]
  economy:
    label: "<#ffd54f><bold>Ekonomi & Gacha</bold></#ffd54f>"
    description: [ "<#90a4ae>Shop, bank, auction, crate</#90a4ae>" ]
    icon: GOLD_INGOT
    actions: [ "PAGE:4" ]
  rank:
    label: "<#b388ff><bold>Rank Paket Plus</bold></#b388ff>"
    description: [ "<#90a4ae>Benefit member & cara beli</#90a4ae>" ]
    icon: DIAMOND
    actions: [ "PAGE:5" ]
  rules:
    label: "<#ef5350><bold>Peraturan</bold></#ef5350>"
    description: [ "<#90a4ae>Wajib dibaca semua pemain</#90a4ae>" ]
    icon: WRITABLE_BOOK
    actions: [ "PAGE:6" ]
  discord:
    label: "<#7c9cff><bold>Gabung Discord</bold></#7c9cff>"
    description: [ "<#90a4ae>dc.unnesmc.my.id</#90a4ae>" ]
    icon: PAINTING
    actions: [ "OPEN_URL:https://dc.unnesmc.my.id" ]
  close:
    label: "<#ef5350>Tutup</#ef5350>"
    icon: BARRIER
    actions: [ "CLOSE" ]

# ---- HALAMAN LAIN ---------------------------------------------------------
pages:
  # HALAMAN 1 — Gamemode & fitur unggulan
  - title: "<gradient:#4dd0e1:#18ffff><bold>GAMEMODE & FITUR UNGGULAN</bold></gradient>"
    body:
      - "<#90a4ae>UNNESMC punya beberapa dunia untuk gaya main berbeda:"
      - icon: DIAMOND_SWORD
        text: "<#33d17a><bold>Survival + Custom Enchant</bold></#33d17a> <#546e7a>—</#546e7a> <#90a4ae>alam liar penuh tantangan. Mesin otomasi tanpa mod, plus enchant unik melampaui vanilla."
      - icon: EMERALD
        text: "<#ffb300><bold>Shop & Gacha</bold></#ffb300> <#546e7a>—</#546e7a> <#90a4ae>jual-beli hasil farming di Shop, uji hoki di Gacha/Crate untuk item langka."
      - icon: BEACON
        text: "<#b388ff><bold>Cross-platform</bold></#b388ff> <#546e7a>—</#546e7a> <#90a4ae>main bareng dari PC, HP, Console & Tablet. Java 25565, Bedrock 19132."
    buttons:
      - id: next
        label: "<gradient:#33d17a:#4dd0e1><bold>Lanjut: Cara Mulai »</bold></gradient>"
        icon: GRASS_BLOCK
        actions: [ "PAGE:2" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]

  # HALAMAN 2 — Cara mulai / survival
  - title: "<gradient:#33d17a:#4dd0e1><bold>CARA MULAI BERMAIN</bold></gradient>"
    body:
      - "<#90a4ae>Ikuti langkah ini untuk mulai petualangan survival-mu:"
      - icon: ENDER_PEARL
        text: "<#33d17a><bold>1.</bold></#33d17a> <white>/rtp</white> <#90a4ae>— teleport acak untuk masuk & mulai world survival."
      - icon: VILLAGER_SPAWN_EGG
        text: "<#33d17a><bold>2.</bold></#33d17a> <white>/warp reso</white> <#90a4ae>— ke World Resource. Bicara ke NPC untuk area farming."
      - icon: LEAD
        text: "<#33d17a><bold>3.</bold></#33d17a> <#90a4ae>Angkat hewan! Shift + klik kanan pada sheep, cow, pig, chicken, atau villager."
    buttons:
      - id: rtp
        label: "<gradient:#33d17a:#4dd0e1><bold>Mulai Survival (/rtp)</bold></gradient>"
        description: [ "<#90a4ae>Teleport & masuk world survival</#90a4ae>" ]
        icon: GRASS_BLOCK
        actions: [ "RUN_COMMAND:/rtp", "CLOSE" ]
      - id: reso
        label: "<#8d6e63><bold>World Resource (/warp reso)</bold></#8d6e63>"
        icon: DIRT_PATH
        actions: [ "RUN_COMMAND:/warp reso", "CLOSE" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]

  # HALAMAN 3 — Fitur & command
  - title: "<gradient:#ffb300:#ffd54f><bold>FITUR & COMMAND PENTING</bold></gradient>"
    body:
      - "<#90a4ae>Command utama yang sering dipakai di UNNESMC:"
      - icon: DIAMOND_PICKAXE
        text: "<#ffb300>/rtp</#ffb300> <#546e7a>•</#546e7a> <#90a4ae>masuk/pindah acak world survival"
      - icon: WHEAT
        text: "<#ffb300>/jobs</#ffb300> <#546e7a>•</#546e7a> <#90a4ae>ambil pekerjaan untuk cari uang"
      - icon: PAPER
        text: "<#ffb300>/vote</#ffb300> <#546e7a>•</#546e7a> <#90a4ae>vote server → dapat Vote Key untuk gacha"
    buttons:
      - id: vote
        label: "<gradient:#33d17a:#4dd0e1><bold>Vote Sekarang</bold></gradient>"
        description: [ "<#90a4ae>vote.unnesmc.my.id — dapat Vote Key</#90a4ae>" ]
        icon: PAPER
        actions: [ "OPEN_URL:https://vote.unnesmc.my.id" ]
      - id: jobs
        label: "<#ffb300><bold>Buka Jobs (/jobs)</bold></#ffb300>"
        icon: IRON_PICKAXE
        actions: [ "RUN_COMMAND:/jobs", "CLOSE" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]

  # HALAMAN 4 — Ekonomi & gacha
  - title: "<gradient:#ffd54f:#ff8f00><bold>EKONOMI, SHOP & GACHA</bold></gradient>"
    body:
      - "<#90a4ae>Sistem ekonomi & belanja di UNNESMC:"
      - icon: EMERALD
        text: "<#ffb300>/shop</#ffb300> <#90a4ae>toko server  <#546e7a>|</#546e7a>  <#ffb300>/cshop</#ffb300> <#90a4ae>player shop (chest shop)"
      - icon: GOLD_INGOT
        text: "<#ffb300>/bank</#ffb300> <#90a4ae>simpan uang  <#546e7a>|</#546e7a>  <#ffb300>/ah</#ffb300> <#90a4ae>auction house (lelang)"
      - icon: CHEST_MINECART
        text: "<#ffb300>/bpass</#ffb300> <#90a4ae>BattlePass  <#546e7a>|</#546e7a>  <#ffb300>/rewards</#ffb300> <#90a4ae>hadiah  <#546e7a>|</#546e7a>  <#ffb300>/daily</#ffb300> <#90a4ae>harian"
      - icon: ENDER_CHEST
        text: "<#b388ff><bold>Gacha/Crate:</bold></#b388ff> <#90a4ae>tempat crate di <white>/warp crate</white>, beli key di <white>/key</white>. Vote untuk key gratis: <white>/vote</white>."
    buttons:
      - id: shop
        label: "<gradient:#33d17a:#4dd0e1><bold>Buka Shop (/shop)</bold></gradient>"
        icon: EMERALD
        actions: [ "RUN_COMMAND:/shop", "CLOSE" ]
      - id: crate
        label: "<#b388ff><bold>Area Crate (/warp crate)</bold></#b388ff>"
        icon: ENDER_CHEST
        actions: [ "RUN_COMMAND:/warp crate", "CLOSE" ]
      - id: key
        label: "<#ffd54f><bold>Beli Key (/key)</bold></#ffd54f>"
        icon: TRIPWIRE_HOOK
        actions: [ "RUN_COMMAND:/key", "CLOSE" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]

  # HALAMAN 5 — Rank Paket Plus Mahasiswa
  - title: "<gradient:#b388ff:#7c4dff><bold>PAKET PLUS MAHASISWA</bold></gradient>"
    body:
      - "<#90a4ae>Dukung UNNESMC & tingkatkan pengalaman bermainmu! <white>Hanya <#33d17a><bold>Rp 10.000 / bulan</bold></#33d17a><white>."
      - icon: EXPERIENCE_BOTTLE
        text: "<#b388ff><bold>BattlePass Premium</bold></#b388ff> <#90a4ae>— akses tier premium, hadiah lebih melimpah."
      - icon: CHEST
        text: "<#b388ff><bold>DailyRewards Premium</bold></#b388ff> <#90a4ae>— klaim hadiah harian 2x lipat."
      - icon: FEATHER
        text: "<#b388ff><bold>/fly upgrade</bold></#b388ff> <#90a4ae>— durasi 5 menit, cooldown 2 jam. Enak buat building."
      - icon: SHULKER_BOX
        text: "<#b388ff><bold>+2 slot /vaults</bold></#b388ff> <#90a4ae>— amankan barang dari clear lag."
      - icon: CRAFTING_TABLE
        text: "<#b388ff><bold>/craft & /ec</bold></#b388ff> <#90a4ae>— crafting & ender chest portabel di mana saja."
      - icon: NAME_TAG
        text: "<#b388ff><bold>/iname</bold></#b388ff> <#90a4ae>— ganti nama item (support warna RGB & magic)."
      - icon: CLOCK
        text: "<#b388ff><bold>/ptime & /pweather</bold></#b388ff> <#90a4ae>— atur waktu & cuaca pribadi."
    buttons:
      - id: buy
        label: "<gradient:#33d17a:#4dd0e1><bold>Beli via Discord</bold></gradient>"
        description: [ "<#90a4ae>dc.unnesmc.my.id</#90a4ae>" ]
        icon: DIAMOND
        actions: [ "OPEN_URL:https://dc.unnesmc.my.id" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]

  # HALAMAN 6 — Peraturan
  - title: "<gradient:#ef5350:#ff8a80><bold>PERATURAN UNNESMC</bold></gradient>"
    body:
      - "<#ef5350><bold>1.</bold></#ef5350> <#90a4ae>Hormati semua pemain. Dilarang toxic, SARA, atau pelecehan."
      - "<#ef5350><bold>2.</bold></#ef5350> <#90a4ae>Dilarang cheat, hack, x-ray, atau exploit bug."
      - "<#ef5350><bold>3.</bold></#ef5350> <#90a4ae>Dilarang griefing & mencuri di lahan orang lain."
      - "<#ef5350><bold>4.</bold></#ef5350> <#90a4ae>Dilarang scam / menipu transaksi antar pemain."
      - "<#ef5350><bold>5.</bold></#ef5350> <#90a4ae>Gunakan bahasa sopan di chat. Iklan server lain = larangan."
      - icon: BARRIER
        text: "<#ef5350><bold>Pelanggaran berat = ban permanen tanpa peringatan. Report ke staff via Discord.</bold></#ef5350>"
    buttons:
      - id: agree
        label: "<gradient:#33d17a:#4dd0e1><bold>Saya Mengerti</bold></gradient>"
        icon: EMERALD
        actions:
          - "MESSAGE:<#33d17a>[UNNESMC] </#33d17a><#90a4ae>Terima kasih sudah membaca peraturan. Selamat bermain!"
          - "SOUND:ENTITY_PLAYER_LEVELUP"
          - "PAGE:0"
      - id: discord
        label: "<#7c9cff><bold>Discord (/report)</bold></#7c9cff>"
        icon: PAINTING
        actions: [ "OPEN_URL:https://dc.unnesmc.my.id" ]
      - id: home
        label: "<#90a4ae>« Daftar Isi</#90a4ae>"
        icon: ARROW
        actions: [ "PAGE:0" ]
