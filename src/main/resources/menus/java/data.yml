# ==========================================================================
#  Menu: data (Profil)  —  JAVA  (menus/java/data.yml)
#  Kartu profil pemain. Nilai per-pemain via PlaceholderAPI (soft):
#    Rank → LuckPerms, Saldo → Vault, Waktu main → statistic, Ping/Level → player.
#  Kepala pemain dipakai sebagai "foto profil" di baris body ber-ikon.
#  Design system & palet: lihat header main.yml.
# ==========================================================================

title: "<gradient:#b388ff:#7c4dff><bold>PROFIL KAMU</bold></gradient>"
kind: MENU
type: AUTO
rows: 3

body:
  - head: "%player_name%"
    text: "<gradient:#b388ff:#e1bee7><bold>%player_name%</bold></gradient>  <#90a4ae>•  <#ffb300>%luckperms_primary_group_name%"
  - icon: EMERALD
    text: "<white>Saldo  <#33d17a>%vault_eco_balance_formatted%"
  - icon: CLOCK
    text: "<white>Waktu Main  <#4dd0e1>%statistic_time_played%"
  - icon: EXPERIENCE_BOTTLE
    text: "<white>Level  <#b388ff>%player_level%   <white>Ping <#ff80ab>%player_ping% <#546e7a>ms"

buttons:
  refresh:
    label: "<#b388ff><bold>Muat Ulang</bold></#b388ff>"
    description: [ "<#90a4ae>Perbarui data profil</#90a4ae>" ]
    icon: PLAYER_HEAD
    slot: 11
    actions: [ "OPEN_MENU:data" ]
  stats:
    label: "<#4dd0e1><bold>Statistik Server</bold></#4dd0e1>"
    description: [ "<#90a4ae>Lihat kondisi server</#90a4ae>" ]
    icon: CLOCK
    slot: 13
    permission: umccore.menu.stats
    actions: [ "OPEN_MENU:stats" ]
  back:
    label: "<#90a4ae>« Kembali</#90a4ae>"
    icon: ARROW
    slot: 15
    actions: [ "OPEN_MENU:main" ]
