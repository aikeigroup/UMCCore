# ==========================================================================
#  Menu: tagfakultas  —  JAVA  (menus/java/tagfakultas.yml)
#  UNNESMC — Pemilihan Tag Fakultas. Buka: /tagfakultas atau
#  /umccore menu tagfakultas.  Render sebagai Dialog native; slot/filler hanya
#  untuk fallback chest-GUI.
#
#  Tiap tombol: unset semua permission tag fakultas lain → set milik sendiri →
#  pesan + title + suara, lalu /tags & /tag set <f> (delay agar CLOSE dulu).
#  Logika & command TIDAK diubah dari versi sebelumnya. Warna judul & pola
#  disamakan dengan design system (lihat header main.yml).
# ==========================================================================

title: "<gradient:#4dd0e1:#18ffff><bold>PILIH TAG FAKULTAS</bold></gradient>"
kind: MENU
type: AUTO
rows: 3

# Filler dekoratif (chest-GUI fallback saja). Dialog tak punya grid slot.
filler:
  icon: GRAY_STAINED_GLASS_PANE
  slots: [ "0-8", "18-26" ]

body:
  - "<#90a4ae>Pilih fakultasmu untuk memakai tag-nya di nama."
  - "<#546e7a>Jika tag belum muncul, jalankan <#4dd0e1>/tags</#4dd0e1><#546e7a>."

buttons:
  fipp:
    label: "<green><bold>FIPP</bold></green>"
    icon: NAME_TAG
    slot: 9
    description:
      - "<#90a4ae>Fakultas Ilmu Pendidikan dan Psikologi</#90a4ae>"
      - ""
      - "<#90a4ae>Preview Tag: <white>[<green><bold>FIPP</bold></green><white>]"
      - ""
      - "<#ffd54f>Klik untuk memilih dan memakai tag ini!</#ffd54f>"
    actions:
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fbs"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fisip"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fmipa"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.ft"
