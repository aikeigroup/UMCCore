    body:
      - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - "<white>Ikuti langkah ini untuk mulai petualangan:"
      - ""
      - "<#69f0ae><bold>1.</bold></#69f0ae> <white>/rtp</white> <#b0bec5>— teleport acak masuk world survival."
      - "<#69f0ae><bold>2.</bold></#69f0ae> <white>/warp reso</white> <#b0bec5>— World Resource, bicara ke NPC untuk farming."
      - "<#69f0ae><bold>3.</bold></#69f0ae> <#b0bec5>Angkat hewan: sneak + ketuk sheep/cow/pig/chicken."
      - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    buttons:
      - id: rtp
        label: "<#69f0ae><bold>Mulai Survival Sekarang</bold>"
        description: [ "<#b0bec5>Jalankan /rtp" ]
        image: "path:textures/items/map_filled"
        actions: [ "RUN_COMMAND:/rtp", "CLOSE" ]
      - id: reso
        label: "<#8d6e63><bold>World Resource</bold>"
        description: [ "<#b0bec5>Jalankan /warp reso" ]
        actions: [ "RUN_COMMAND:/warp reso", "CLOSE" ]
