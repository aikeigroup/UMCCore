  # HALAMAN 6 — Peraturan
  - title: "<gradient:#ff5252:#ff8a80><bold>PERATURAN</bold></gradient>"
    body:
      - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - "<#ff8a80><bold>1.</bold></#ff8a80> <#b0bec5>Hormati semua pemain. Dilarang toxic, SARA, pelecehan."
      - "<#ff8a80><bold>2.</bold></#ff8a80> <#b0bec5>Dilarang cheat, hack, x-ray, atau exploit bug."
      - "<#ff8a80><bold>3.</bold></#ff8a80> <#b0bec5>Dilarang griefing & mencuri."
      - "<#ff8a80><bold>4.</bold></#ff8a80> <#b0bec5>Dilarang scam / menipu transaksi."
      - "<#ff8a80><bold>5.</bold></#ff8a80> <#b0bec5>Bahasa sopan. Iklan server lain = dilarang."
      - ""
      - "<#ff5252><bold>Pelanggaran berat = ban permanen. Report via Discord.</bold></#ff5252>"
      - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
