      - "<#b388ff>◆</#b388ff> <#b0bec5>/fly upgrade — durasi 5 menit, cooldown 2 jam."
      - "<#b388ff>◆</#b388ff> <#b0bec5>+2 slot /vaults — aman dari clear lag."
      - "<#b388ff>◆</#b388ff> <#b0bec5>/craft & /ec — crafting & ender chest portabel."
      - "<#b388ff>◆</#b388ff> <#b0bec5>/iname — ganti nama item (warna RGB)."
