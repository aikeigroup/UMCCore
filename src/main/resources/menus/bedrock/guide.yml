# ==========================================================================
#  Menu: guide  —  BEDROCK variant  (menus/bedrock/guide.yml)
#  Panduan UNNESMC khusus pemain Bedrock. Render sebagai FORM NATIVE
#  (Cumulus SimpleForm) — teks rapi di atas, tombol besar enak disentuh,
#  navigasi « Prev / Next » otomatis antar halaman.
#
#  Tips Bedrock:
#   - Body panjang aman: form Bedrock bisa scroll.
#   - image: head:<nama> memberi wajah pemain pada tombol.
#   - Warna dibuat terang (kontras di panel gelap form).
# ==========================================================================

title: "<gradient:#43e97b:#38f9d7><bold>PANDUAN UNNESMC</bold></gradient>"
kind: MENU
type: AUTO

# ---- HALAMAN 0 — Selamat datang / daftar isi ------------------------------
body:
  - "<white>Halo <yellow><bold>%player_name%</bold></yellow><white>, selamat datang di"
  - "<#69f0ae><bold>UNNESMC</bold></#69f0ae> <gray>—</gray> <white>UNNES Minecraft Community."
  - ""
  - "<white>Wadah mahasiswa UNNES & pencinta Minecraft untuk mabar & refreshing."
  - "<#ffe082>IP Java:</#ffe082> <white>play.unnesmc.my.id"
  - "<#ffe082>Bedrock:</#ffe082> <white>play.unnesmc.my.id <gray>:</gray> 19132"
  - ""
  - "<#b9f6ca>Pilih topik di bawah, atau ketuk Next »</#b9f6ca>"

buttons:
  about:
    label: "<#64ffda><bold>🏝 Gamemode & Fitur</bold>"
    description: [ "Skyblock, Survival, cross-platform" ]
    image: "url:https://mc-heads.net/avatar/MHF_Beacon/64"
    actions: [ "PAGE:1" ]
  start:
    label: "<#69f0ae><bold>🚀 Cara Mulai</bold>"
    description: [ "Langkah pertama masuk survival" ]
    image: "url:https://mc-heads.net/avatar/MHF_Grass/64"
    actions: [ "PAGE:2" ]
  features:
    label: "<#ffd740><bold>🛠 Fitur & Command</bold>"
    description: [ "Command penting server" ]
    image: "url:https://mc-heads.net/avatar/MHF_Present1/64"
    actions: [ "PAGE:3" ]
  economy:
    label: "<#ffb300><bold>💰 Ekonomi & Gacha</bold>"
    description: [ "Shop, bank, auction, crate" ]
    image: "url:https://mc-heads.net/avatar/MHF_Chest/64"
    actions: [ "PAGE:4" ]
  rank:
    label: "<#e040fb><bold>🎓 Rank Paket Plus</bold>"
    description: [ "Benefit member & cara beli" ]
    image: "url:https://mc-heads.net/avatar/MHF_Cactus/64"
    actions: [ "PAGE:5" ]
  rules:
    label: "<#ff5252><bold>📜 Peraturan</bold>"
    description: [ "Wajib dibaca semua pemain" ]
    image: "url:https://mc-heads.net/avatar/MHF_Redstone/64"
    actions: [ "PAGE:6" ]
