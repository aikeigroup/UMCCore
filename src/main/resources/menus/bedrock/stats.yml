# ==========================================================================
#  Menu: stats  —  BEDROCK  (menus/bedrock/stats.yml)
#  Panel kondisi server LIVE untuk pemain Bedrock. Angka + bar + verdict
#  berubah warna sesuai kesehatan server (hijau/emas/merah), dihitung oleh
#  expansion UMCCore — jadi pemain langsung paham tanpa harus tahu artinya.
#
#  Placeholder presentasi (keluaran berwarna, aman ditempel di body):
#    %umccore_health%       Sehat / Waspada / Berat  (verdict berwarna)
#    %umccore_tps_colored%  TPS diwarnai sesuai nilai
#    %umccore_tps_bar%      bar 10 segmen kesehatan TPS
#    %umccore_mspt_colored% MSPT diwarnai (makin kecil makin baik)
#    %umccore_ram_percent%  persen RAM terpakai
#    %umccore_ram_bar%      bar 10 segmen pemakaian RAM
#  Placeholder mentah: %umccore_online% %umccore_max_players%
#    %umccore_ram_used% %umccore_ram_max% %umccore_entities%
#    %umccore_chunks% %umccore_uptime%
#  Design system & palet: lihat header main.yml.
# ==========================================================================

title: "<gradient:#40c4ff:#18ffff><bold>STATISTIK SERVER</bold></gradient>"
kind: MENU
type: AUTO

body:
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  - "<#b0bec5>Kondisi</#b0bec5>  <bold>%umccore_health%</bold>"
  - ""
  - "<#b0bec5>TPS</#b0bec5>   %umccore_tps_bar%  <bold>%umccore_tps_colored%</bold> <#607d8b>/ 20"
  - "<#b0bec5>MSPT</#b0bec5>  <bold>%umccore_mspt_colored%</bold> <#607d8b>ms"
  - "<#b0bec5>RAM</#b0bec5>   %umccore_ram_bar%  <white>%umccore_ram_percent%%</white> <#607d8b>(%umccore_ram_used%/%umccore_ram_max% MB)"
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  - "<#b0bec5>Pemain</#b0bec5>  <white>%umccore_online%<#607d8b>/%umccore_max_players%"
  - "<#b0bec5>Entity</#b0bec5>  <white>%umccore_entities%   <#b0bec5>Chunk</#b0bec5> <white>%umccore_chunks%"
  - "<#b0bec5>Uptime</#b0bec5>  <white>%umccore_uptime%"
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

buttons:
  refresh:
    label: "<#69f0ae><bold>Muat Ulang</bold>"
    description: [ "<#b0bec5>Perbarui angka statistik" ]
    image: "path:textures/ui/refresh"
    actions: [ "OPEN_MENU:stats" ]
  back:
    label: "<#90a4ae>« Kembali"
    actions: [ "OPEN_MENU:main" ]
