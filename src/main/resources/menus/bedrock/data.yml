# ==========================================================================
#  Menu: data (Profil)  —  BEDROCK  (menus/bedrock/data.yml)
#  Kartu profil pemain untuk Bedrock. Semua nilai per-pemain via PlaceholderAPI.
#  Beberapa butuh plugin lain (soft): kalau tak ada, placeholder tampil mentah.
#    Rank       → LuckPerms  (%luckperms_primary_group_name%)
#    Saldo      → Vault      (%vault_eco_balance_formatted%)
#    Waktu main → statistic  (%statistic_time_played%)
#    Ping/Level/Health → server/player expansion PAPI
#  Design system & palet: lihat header main.yml.
# ==========================================================================

title: "<gradient:#b388ff:#7c4dff><bold>PROFIL KAMU</bold></gradient>"
kind: MENU
type: AUTO

body:
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  - "<white><bold>%player_name%</bold>"
  - "<#b0bec5>Rank</#b0bec5>  <#ffd740>%luckperms_primary_group_name%"
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  - "<#69f0ae>◆ Saldo</#69f0ae>  <white>%vault_eco_balance_formatted%"
  - "<#40c4ff>◆ Waktu Main</#40c4ff>  <white>%statistic_time_played%"
  - "<#b388ff>◆ Level</#b388ff>  <white>%player_level%"
  - "<#ff80ab>◆ Ping</#ff80ab>  <white>%player_ping% <#607d8b>ms"
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

buttons:
  refresh:
    label: "<#b388ff><bold>Muat Ulang</bold>"
    description: [ "<#b0bec5>Perbarui data profil" ]
    image: "path:textures/ui/refresh"
    actions: [ "OPEN_MENU:data" ]
  stats:
    label: "<#40c4ff><bold>Statistik Server</bold>"
    description: [ "<#b0bec5>Lihat kondisi server" ]
    image: "path:textures/items/nether_star"
    permission: umccore.menu.stats
    actions: [ "OPEN_MENU:stats" ]
  back:
    label: "<#90a4ae>« Kembali"
    actions: [ "OPEN_MENU:main" ]
