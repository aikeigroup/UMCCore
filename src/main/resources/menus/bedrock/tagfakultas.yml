# ==========================================================================
#  Menu: tagfakultas  —  BEDROCK  (menus/bedrock/tagfakultas.yml)
#  Pemilihan Tag Fakultas untuk pemain Bedrock (Cumulus SimpleForm).
#  Buka: /umccore menu tagfakultas  atau  /tagfakultas
#
#  Tiap tombol: unset semua permission tag fakultas lain → set milik sendiri →
#  pesan + title + suara, lalu /tags & /tag set <f> (delay agar CLOSE dulu).
#  Warna fakultas dibuat TERANG (kontras di panel gelap form Bedrock).
#  Design system & palet: lihat header main.yml.
# ==========================================================================

title: "<gradient:#64ffda:#18ffff><bold>PILIH TAG FAKULTAS</bold></gradient>"
kind: MENU
type: AUTO

body:
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  - "<#b0bec5>Ketuk fakultasmu untuk memakai tag-nya."
  - "<#607d8b>Jika tag belum muncul, jalankan <#ffd740>/tags</#ffd740><#607d8b>."
  - "<#37474f>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

buttons:
  fipp:
    label: "<#69f0ae><bold>FIPP</bold>"
    description: [ "<#b0bec5>Ilmu Pendidikan & Psikologi" ]
    image: "path:textures/items/name_tag"
    actions:
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fbs"
