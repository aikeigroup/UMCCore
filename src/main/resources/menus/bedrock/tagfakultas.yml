# ==========================================================================
#  Menu: tagfakultas  —  BEDROCK variant  (menus/bedrock/tagfakultas.yml)
#  Pemilihan Tag Fakultas untuk pemain Bedrock (Cumulus SimpleForm).
#  Buka: /umccore menu tagfakultas  atau  /tagfakultas
#
#  KONTRAS: warna fakultas gelap di versi Java (&4 FH, &2 FK) diganti versi
#  TERANG di sini agar terbaca di panel gelap form Bedrock. Logika set/unset
#  permission + /tags + title identik dengan versi Java.
# ==========================================================================

title: "<gradient:#64ffda:#18ffff><bold>PILIH TAG FAKULTAS</bold></gradient>"
kind: MENU
type: AUTO

body:
  - "<white>Ketuk fakultasmu untuk memakai tag-nya."
  - "<gray>Jika tag belum muncul, jalankan</gray> <#ffd740>/tags</#ffd740><gray>.</gray>"

buttons:
  fipp:
    label: "<#69f0ae><bold>FIPP</bold>"
    description: [ "Ilmu Pendidikan & Psikologi" ]
    image: "url:https://mc-heads.net/avatar/MHF_Exclamation/64"
    actions:
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fbs"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fisip"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fmipa"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.ft"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fik"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.feb"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fh"
      - "CONSOLE_COMMAND:lp user %player_name% permission unset supremetags.tag.fk"
      - "CONSOLE_COMMAND:lp user %player_name% permission set supremetags.tag.fipp true"
      - "MESSAGE:<gray>[<aqua>UNNES</aqua>] <green>Berhasil memilih tag <white>[<green><bold>FIPP</bold></green>]<green>!"
      - "TITLE:<aqua>Selamat Datang!;<white>di <green><bold>FIPP;10;60;10"
      - "SOUND:ENTITY_PLAYER_LEVELUP"
      - "CLOSE"
      - "RUN_COMMAND:tag set fipp<delay=100>"
