# ==========================================================================
#  Menu: warps  —  BEDROCK variant  (menus/bedrock/warps.yml)
#  Daftar warp untuk pemain Bedrock. Tiap tombol teleport ke satu lokasi.
#  Batasi warp tertentu dengan permission umccore.warp.<nama>.
#  Format TELEPORT: world,x,y,z[,yaw,pitch]
# ==========================================================================

title: "<gradient:#40c4ff:#18ffff><bold>DAFTAR WARP</bold></gradient>"
kind: MENU
type: AUTO

body:
  - "<white>Ketuk tujuan untuk langsung teleport."

buttons:
  spawn:
    label: "<#69f0ae><bold>🏠 Spawn</bold>"
    description: [ "Hub utama server" ]
    image: "url:https://mc-heads.net/avatar/MHF_Beacon/64"
    permission: umccore.warp.spawn
    actions:
      - "TELEPORT:world,0.5,100,0.5"
      - "MESSAGE:<green>Warp ke spawn."
      - "CLOSE"
  shop:
    label: "<#ffd740><bold>🛒 Shop</bold>"
    description: [ "Beli & jual" ]
    image: "url:https://mc-heads.net/avatar/MHF_Present2/64"
    permission: umccore.warp.shop
    actions:
      - "TELEPORT:world,50.5,100,50.5"
      - "CLOSE"
  pvp:
    label: "<#ff5252><bold>⚔ Arena PvP</bold>"
    description: [ "Bertarung dengan pemain lain" ]
    permission: umccore.warp.pvp
    actions:
      - "TELEPORT:world,-100.5,80,-100.5"
      - "CLOSE"
  back:
    label: "<#b0bec5>« Kembali ke Menu"
    actions: [ "OPEN_MENU:main" ]
