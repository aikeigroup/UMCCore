# ==========================================================================
#  Menu: tagfakultas  (menus/tagfakultas.yml)
#  UNNESMC — Pemilihan Tag Fakultas (converted from DeluxeMenus).
#  Buka: /umccore menu tagfakultas    Reload: /umccore reload
#
#  Catatan konversi dari DeluxeMenus:
#   - [console] cmd            -> "CONSOLE_COMMAND:cmd"
#   - [player]  cmd            -> "RUN_COMMAND:cmd"
#   - [message] teks           -> "MESSAGE:teks"
#   - [title] a;b;in;stay;out  -> "TITLE:a;b;in;stay;out"
#   - [sound] KEY              -> "SOUND:KEY"
#   - [close]                  -> "CLOSE"
#   - <delay=100>              -> tetap didukung (100 tick = 5 detik)
#   - Kode warna & (legacy) tetap dipakai apa adanya — UMCCore mengonversinya
#     ke MiniMessage otomatis. (MiniMessage juga boleh, mis. <green>.)
#
#  Menu ini render sebagai Dialog native (Java + Bedrock via Geyser). Grid
#  slot/filler hanya berlaku pada fallback chest-GUI.
# ==========================================================================

title: '&8> &b&lPilih Tag Fakultas'
