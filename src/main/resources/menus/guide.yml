# ---- HALAMAN LAIN ---------------------------------------------------------
pages:
  # HALAMAN 1 — Gamemode & fitur unggulan
  - title: '&b&lGamemode & Fitur Unggulan'
    body:
      - '&7UNNESMC punya beberapa dunia untuk gaya main berbeda:'
      - icon: SNOW_BLOCK
        text: '&b🏝 Skyblock (Slimefun) &8— &7bertahan hidup di angkasa. Mulai dari pulau kecil, pakai teknologi & sihir Slimefun bangun pulau melayang canggih.'
      - icon: DIAMOND_SWORD
        text: '&a⚔ Survival (Slimefun + Custom Enchant) &8— &7alam liar penuh tantangan. Mesin otomasi & teknologi Slimefun tanpa mod, plus enchant unik melampaui vanilla.'
      - icon: EMERALD
        text: '&6🛒 Shop & Gacha &8— &7jual-beli hasil farming/teknologi di Shop, uji hoki di Gacha/Crate untuk item langka.'
      - icon: BEACON
        text: '&d🌐 Cross-platform &8— &7main bareng dari PC, HP (PE), Console, & Tablet. Java: &f25565&7, Bedrock: &f19132&7.'
      - '&7Ajak teman se-kampus & tunjukkan kreativitasmu! Lanjut ke &eCara Mulai »'
    buttons:
      - id: next
        label: '&a&lCara Mulai »'
        icon: GRASS_BLOCK
        actions: [ 'PAGE:2' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]

  # HALAMAN 2 — Cara mulai / survival
  - title: '&a&lCara Mulai Bermain'
    body:
      - '&7Ikuti langkah ini untuk mulai petualangan survival-mu:'
      - icon: ENDER_PEARL
        text: '&a1. &f/rtp &7— teleport acak untuk masuk & mulai &lworld survival&7.'
      - icon: VILLAGER_SPAWN_EGG
        text: '&a2. &f/warp reso &7— ke &lWorld Resource&7. Bicara ke NPC untuk dipindah ke area farming resource.'
      - icon: IRON_NUGGET
        text: '&a3. Claim lahanmu &7(RedProtect). Ambil wand dengan &f/rp wand &7(iron nugget), klik 2 titik. Bisa juga claim dengan &lpagar/fence&7.'
      - icon: LEAD
        text: '&a4. Angkat hewan! &7Shift + klik kanan pada sheep, cow, pig, chicken, atau villager untuk menggendongnya.'
      - '&7Sudah siap? Cek fitur & command di halaman berikutnya. &eNext »'
    buttons:
      - id: rtp
        label: '&a&lMulai Survival (/rtp)'
        description: [ '&7Teleport & masuk world survival' ]
        icon: GRASS_BLOCK
        actions: [ 'RUN_COMMAND:/rtp', 'CLOSE' ]
      - id: reso
        label: '&2World Resource (/warp reso)'
        icon: DIRT_PATH
        actions: [ 'RUN_COMMAND:/warp reso', 'CLOSE' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]

  # HALAMAN 3 — Fitur & command
  - title: '&e&lFitur & Command Penting'
    body:
      - '&7Command utama yang sering dipakai di UNNESMC:'
      - icon: DIAMOND_PICKAXE
        text: '&e/rtp &8• &7masuk/pindah acak world survival'
      - icon: OAK_FENCE
        text: '&e/rp wand &8• &7alat claim RedProtect (iron nugget)'
      - icon: WHEAT
        text: '&e/jobs &8• &7ambil pekerjaan untuk cari uang'
      - icon: PAPER
        text: '&e/vote &8• &7vote server → dapat &lVote Key&7 untuk gacha'
      - icon: SLIME_BALL
        text: '&e/sf &8• &7buka panduan Slimefun'
      - icon: LEAD
        text: '&7Angkat mob: &fShift + klik kanan &7pada sheep/cow/pig/chicken/villager.'
    buttons:
      - id: vote
        label: '&b&lVote Sekarang'
        description: [ '&7vote.unnesmc.my.id — dapat Vote Key' ]
        icon: PAPER
        actions: [ 'OPEN_URL:https://vote.unnesmc.my.id' ]
      - id: jobs
        label: '&6Buka Jobs (/jobs)'
        icon: IRON_PICKAXE
        actions: [ 'RUN_COMMAND:/jobs', 'CLOSE' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]

  # HALAMAN 4 — Ekonomi & gacha
  - title: '&6&lEkonomi, Shop & Gacha'
    body:
      - '&7Sistem ekonomi & belanja di UNNESMC:'
      - icon: EMERALD
        text: '&6/shop &8• &7toko server  &8|  &6/cshop &8• &7player shop (chest shop)'
      - icon: GOLD_INGOT
        text: '&6/bank &8• &7simpan uang  &8|  &6/ah &8• &7auction house (lelang antar pemain)'
      - icon: CHEST_MINECART
        text: '&6/bpass &8• &7BattlePass  &8|  &6/rewards &8• &7hadiah  &8|  &6/daily &8• &7harian'
      - icon: ENDER_CHEST
        text: '&6Gacha/Crate: &7tempat crate di &f/warp crate&7, beli key di &f/key&7. Vote untuk key gratis: &f/vote&7.'
    buttons:
      - id: shop
        label: '&a&lBuka Shop (/shop)'
        icon: EMERALD
        actions: [ 'RUN_COMMAND:/shop', 'CLOSE' ]
      - id: crate
        label: '&d&lArea Crate (/warp crate)'
        icon: ENDER_CHEST
        actions: [ 'RUN_COMMAND:/warp crate', 'CLOSE' ]
      - id: key
        label: '&eBeli Key (/key)'
        icon: TRIPWIRE_HOOK
        actions: [ 'RUN_COMMAND:/key', 'CLOSE' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]

  # HALAMAN 5 — Rank Paket Plus Mahasiswa
  - title: '&d&l🎓 Paket Plus Mahasiswa'
    body:
      - '&7Dukung UNNESMC & tingkatkan pengalaman bermainmu! &fHanya &aRp 10.000 / bulan&7.'
      - icon: EXPERIENCE_BOTTLE
        text: '&d🎟 &fBattlePass Premium &7— akses tier premium, hadiah lebih melimpah.'
      - icon: CHEST
        text: '&d🎁 &fDailyRewards Premium &7— klaim hadiah harian &l2x lipat&7.'
      - icon: FEATHER
        text: '&d🕊 &f/fly upgrade &7— durasi &l5 menit&7, cooldown &l2 jam&7. Enak buat building.'
      - icon: SHULKER_BOX
        text: '&d📦 &f+2 slot /vaults &7— amankan barang dari clear lag.'
      - icon: CRAFTING_TABLE
        text: '&d🛠 &f/craft &7& &f/ec &7— crafting & ender chest portabel di mana saja.'
      - icon: NAME_TAG
        text: '&d✍ &f/iname &7— ganti nama item (support warna RGB & magic).'
      - icon: CLOCK
        text: '&d🌤 &f/ptime &7& &f/pweather &7— atur waktu & cuaca pribadi.'
      - '&7Cara beli: &fkunjungi Discord kami &7→ &bdc.unnesmc.my.id'
    buttons:
      - id: buy
        label: '&a&lBeli via Discord'
        description: [ '&7dc.unnesmc.my.id' ]
        icon: DIAMOND
        actions: [ 'OPEN_URL:https://dc.unnesmc.my.id' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]

  # HALAMAN 6 — Peraturan
  - title: '&c&lPeraturan UNNESMC'
    body:
      - '&c1. &7Hormati semua pemain. Dilarang toxic, SARA, atau pelecehan.'
      - '&c2. &7Dilarang cheat, hack, x-ray, atau exploit bug.'
      - '&c3. &7Dilarang griefing & mencuri di lahan orang lain. Claim lahanmu (&f/rp wand&7).'
      - '&c4. &7Dilarang scam / menipu transaksi antar pemain.'
      - '&c5. &7Gunakan bahasa sopan di chat. Iklan server lain = larangan.'
      - icon: BARRIER
        text: '&4Pelanggaran berat = ban permanen tanpa peringatan. Report ke staff via Discord.'
    buttons:
      - id: agree
        label: '&a&lSaya Mengerti'
        icon: EMERALD
        actions:
          - 'MESSAGE:&a[UNNESMC] &7Terima kasih sudah membaca peraturan. Selamat bermain!'
          - 'SOUND:ENTITY_PLAYER_LEVELUP'
          - 'PAGE:0'
      - id: discord
        label: '&9Discord (/report)'
        icon: PAINTING
        actions: [ 'OPEN_URL:https://dc.unnesmc.my.id' ]
      - id: home
        label: '&7« Daftar Isi'
        icon: ARROW
        actions: [ 'PAGE:0' ]
