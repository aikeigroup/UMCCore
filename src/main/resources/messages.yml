# ==========================================================================
#  UMCCore — Messages (messages.yml)
#  All text uses MiniMessage format: https://docs.advntr.dev/minimessage/
#  Tokens like {name} are replaced by the plugin before display.
# ==========================================================================

# Prefix prepended to most plugin messages.
prefix: "<gray>[<gradient:#00c6ff:#0072ff>UMC</gradient>]</gray> "

command:
  # Shown when an unknown sub-command is typed. {input} = what was typed.
  unknown: "<red>Unknown command:</red> <yellow>{input}</yellow><red>. Try</red> <white>/umccore help</white><red>.</red>"
  # Shown when the sender lacks permission for a sub-command.
  no-permission: "<red>You don't have permission to do that.</red>"
  # Shown when a player-only command is run from console.
  player-only: "<red>This command can only be used by a player.</red>"

reload:
  # Sent right before the reload begins.
  start: "<gray>Reloading UMCCore...</gray>"
  # Sent on success. {modules} = how many modules re-enabled, {ms} = duration.
  success: "<green>Reload complete.</green> <gray>{modules} module(s) active in {ms}ms.</gray>"
  # Sent on failure. {error} = the error message.
  failure: "<red>Reload failed:</red> <gray>{error}</gray> <red>See console for details.</red>"

perf:
  # Shown when /umccore perf is used but the performance module is disabled.
  disabled: "<red>The performance module is disabled.</red>"

clearlag:
  # Shown when /umccore clearlag is used but the clearlag module is disabled.
  disabled: "<red>The clearlag module is disabled.</red>"
  # Result of a manual cleanup. {count} = entities removed.
  manual: "<green>Cleanup complete.</green> <gray>Removed <yellow>{count}</yellow> entities.</gray>"

module:
  # Correct usage hint for /umccore module.
  usage: "<gray>Usage:</gray> <white>/umccore module <list|enable|disable> [name]</white>"
  # {name} = module id that does not exist.
  unknown: "<red>Unknown module:</red> <yellow>{name}</yellow>"
  # {name} = module just enabled/disabled.
  enabled: "<green>Enabled module</green> <yellow>{name}</yellow><green>.</green>"
  disabled: "<green>Disabled module</green> <yellow>{name}</yellow><green>.</green>"
  # {name} = module, {state} = its current state (active/inactive).
  already: "<yellow>{name}</yellow> <gray>is already {state}.</gray>"

discord:
  # Shown when /umccore discord is used but the module is disabled.
  disabled: "<red>The Discord module is disabled (or DiscordSRV is missing).</red>"
  # Confirmation that an update was queued.
  updating: "<green>Discord embeds are being updated...</green>"

actionbar:
  # Shown when the module is disabled but /umccore actionbar is used.
  disabled: "<red>The action bar module is disabled.</red>"
  # Shown when toggling is disabled in config.
  toggle-disabled: "<red>Action bar toggling is disabled on this server.</red>"
  # Feedback when the player shows/hides their bar.
  shown: "<green>Action bar shown.</green>"
  hidden: "<gray>Action bar hidden.</gray>"

menu:
  # Usage hint for /umccore menu.
  usage: "<gray>Usage:</gray> <white>/umccore menu <name> [player]</white>"
  # {name} = menu id that does not exist.
  unknown: "<red>Unknown menu:</red> <yellow>{name}</yellow>"
  # Shown when the player lacks the menu's permission. {name} = menu id.
  no-permission: "<red>You can't open that menu.</red>"
  # {player} = the offline/absent target of /umccore menu <name> <player>.
  player-offline: "<red>Player</red> <yellow>{player}</yellow> <red>is not online.</red>"
  # Confirmation when opening a menu for someone else.
  opened-for: "<green>Opened</green> <yellow>{name}</yellow> <green>for</green> <white>{player}</white><green>.</green>"
