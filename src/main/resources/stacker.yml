# ==========================================================================
#  UMCCore — Stackers (stacker.yml)
#  Mob stacker and item-drop stacker. Reduces entity count to lower MSPT.
#  Disable modules individually in config.yml (mobstacker / itemstacker).
# ==========================================================================

mob-stacker:
  # Merge nearby same-type mobs into one entity representing the whole stack.
  enabled: true
  # Radius (blocks) to search for same-type mobs to merge. Larger = more
  # aggressive but heavier scans. Recommended 4-8.
  merge-radius: 5
  # Maximum mobs in a single stack. 0 = unlimited (not recommended).
  max-stack-size: 100
  # How often (ticks) to run the merge scan. 20 ticks = 1 second.
  scan-interval-ticks: 40
  # Stack name shown above the mob. Tokens: {type} {amount}. Supports PAPI.
  display-name: "<yellow>{type} <gray>x{amount}"
  # When true, killing a stacked mob only removes one from the stack and drops
  # loot/XP for one. When false, the whole stack dies at once.
  kill-one-at-a-time: true
  # Extra mob types to never stack (add your own). Uses Bukkit EntityType names
  # in lowercase, e.g. [pig, cow]. This adds to the built-in default list below.
  blacklist-types: []
  # Use the built-in default blacklist of mobs that should never stack:
  #   villager, zombie_villager, wandering_trader   (trades break if stacked)
  #   iron_golem, snow_golem, allay                 (helpers/utility)
  #   ender_dragon, wither, elder_guardian, warden  (bosses / unique)
  #   horse, donkey, mule, llama, trader_llama, camel, strider, pig,
  #     skeleton_horse, zombie_horse                (rideable mounts)
  #   sniffer, creaking, shulker, ravager           (special behaviour)
  # Set false to manage the blacklist entirely yourself via blacklist-types.
  use-default-blacklist: true
  # If non-empty, ONLY these types are allowed to stack (overrides blacklist).
  whitelist-types: []
  # Never stack these regardless of type:
  protect-named: true     # mobs with a name tag / custom name
  protect-tamed: true     # tamed pets (wolves, cats, parrots, horses...)
  protect-leashed: true   # leashed mobs
  # Never stack mobs wearing/holding equipment (armour or hand items) — e.g.
  # armed piglins, kitted zombies, or mobs you gave items to.
  protect-equipped: true
  # Never stack "persistent" mobs (name-tagged, spawn-egg, or flagged not to
  # despawn). NOTE: bred farm animals are also persistent — leave this false if
  # you WANT to stack your farm animals. Default false for that reason.
  protect-persistent: false
  # Only merge mobs of the same age group (don't mix babies with adults).
  match-age: true
  # Per-world overrides. Example:
  # per-world:
  #   world_nether:
  #     enabled: false
  per-world: {}

item-stacker:
  # Merge same-type item drops on the ground into one entity with a count.
  enabled: true
  # Radius (blocks) to search for matching item drops to merge.
  merge-radius: 4
  # How often (ticks) to run the merge scan.
  scan-interval-ticks: 40
  # Maximum items represented by a single ground stack. 0 = vanilla max.
  max-stack-size: 0
  # Show the amount as a floating label above merged item stacks.
  show-amount-label: true
  # Only merge items whose metadata (name, enchants) matches exactly.
  respect-metadata: true
