# ==========================================================================
#  UMCCore — Mob Pickup (pickup.yml)
#  Pick up a mob and carry it on your head, then drop it.
#  Disable with modules.pickup: false in config.yml.
#
#  How to use (in game):
#   - Right-click a mob (empty hand) to lift it onto your head.
#   - While carrying:
#       * quick tap sneak (shift)  -> drop the mob in front of you
#       * hold sneak               -> a throw-power bar oscillates on the action
#                                      bar (full -> low -> full ...); release to
#                                      throw the mob with that power. Time your
#                                      release for the distance you want.
#  Requires permission umccore.pickup.use (hostile mobs also need
#  umccore.pickup.hostile).
# ==========================================================================

# Require sneaking to PICK UP. Default false because sneak is used for the
# drop/throw control while carrying — with this true you'd throw the moment you
# pick up. Leave false unless you disable throwing below.
require-sneak: false

# Throw-on-hold-sneak with an oscillating power meter.
throw:
  enabled: true
  # A sneak released faster than this (ms) counts as a tap = drop, not a throw.
  tap-max-ms: 200
  # Throw velocity at the meter's minimum and maximum. Higher = farther.
  min-power: 0.6
  max-power: 2.4
  # Ticks for one full oscillation of the meter (full -> min -> full). Lower =
  # faster/harder to time. 30 ticks = 1.5s at 20 fps.
  charge-cycle-ticks: 30

# Require an empty main hand to pick up (so held items still work normally).
require-empty-hand: true

# Per-mob permission. When true, a player also needs
#   umccore.pickup.mob.<type>   (e.g. umccore.pickup.mob.cow)
# to pick up that specific mob type. Grant all with umccore.pickup.mob.* in
# LuckPerms. When false (default), only umccore.pickup.use (+ .hostile) is
# checked, regardless of mob type.
per-mob-permission: false

# Which mob categories may be picked up.
allow-passive: true
allow-hostile: true

# Optional: only pick up mobs at or below this health (0 = no limit). Useful to
# stop players lifting full-health bosses/minibosses.
max-health: 0

# Mob types that can never be picked up (Bukkit EntityType names, lowercase).
# Bosses and large mounts are good candidates.
blacklist-types:
  - ender_dragon
  - wither
  - warden
  - ravager
  - happy_ghast
