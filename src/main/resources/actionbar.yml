# ==========================================================================
#  UMCCore — Animated Action Bar (actionbar.yml)
#  Fully animated: text is redrawn every frame, and EVERY transition between
#  messages is animated too (no hard cuts). Disable with
#  modules.actionbar: false in config.yml.
# ==========================================================================

# Master enable (redundant with modules.actionbar, kept for convenience).
enabled: true

# Ticks between animation frames. Lower = smoother but slightly more work.
# 1 tick (~20 fps) is the smoothest; 2 (~10 fps) is lighter. Default 1 for
# smooth motion.
frame-interval-ticks: 1

# Players can hide their own action bar with /umccore actionbar toggle.
allow-player-toggle: true

# Resolve PlaceholderAPI placeholders inside frames (per-player).
resolve-placeholders: true

# ---------------------------------------------------------------------------
# Rotation: a list of "segments" shown in sequence. Each segment is animated
# while displayed, and the change from one segment to the next is ALSO animated
# via the configured transition. Nothing ever appears as an instant hard cut.
# ---------------------------------------------------------------------------
rotation:
  # How long (in frames) each segment stays fully visible before transitioning.
  # At 1 tick/frame, 160 frames = 8 seconds per segment. Raise this if the
  # rotation feels too frequent/distracting; lower it to cycle faster.
  hold-frames: 160
  # Transition animation played between segments. Options:
  #   TYPEWRITER  - old text erased char-by-char, new text typed in
  #   SLIDE       - old text slides out, new text slides in
  #   FADE        - cross-fade using color interpolation
  #   WAVE        - characters ripple as they swap
  transition: FADE
  # Frames the transition takes to complete. At 1 tick/frame, 20 = 1 second —
  # a gentle, non-jarring change.
  transition-frames: 20

# The segments themselves. Each has a base text plus an in-segment animation.
#
# COLOURS: text uses MiniMessage, so full hex/RGB is supported:
#   <#ff8800>orange</#ff8800>          - a single hex colour
#   <gradient:#ff0000:#00ff00>hi</gradient>  - a hex gradient
#   <rainbow>hello</rainbow>            - static rainbow
# Use animation NONE (or STATIC) to keep YOUR colours exactly as written; the
# colour animations below (RAINBOW/GRADIENT_SHIFT/PULSE) recolour the text.
#
# Motion has built-in pauses (jeda): each colour animation drifts for ~2s then
# rests ~1.5s, so it never feels frantic.
segments:
  - id: welcome
    # This keeps your own hex gradient exactly (animation NONE).
    text: "<gray>Welcome to <gradient:#00c6ff:#0072ff>the server</gradient></gray>"
    # In-segment animation while shown. Options:
    #   NONE / STATIC  - keep the text's own colours (hex/gradient) unchanged
    #   GRADIENT_SHIFT - a gradient gently drifts across the text
    #   RAINBOW        - slow rainbow hue cycle
    #   PULSE          - gentle brightness pulse
    #   SCROLL         - text scrolls slowly within a window
    #   WAVE           - a soft highlight sweeps across the characters
    animation: NONE
    # Optional permission to see this segment; empty = everyone.
    permission: ""

  - id: stats
    text: "<green>TPS %umccore_tps%</green> <dark_gray>|</dark_gray> <aqua>Online %umccore_online%</aqua>"
    animation: PULSE
    permission: ""

  - id: tip
    text: "<#ffcc00>Tip: open the menu with /umccore menu main</#ffcc00>"
    animation: NONE
    permission: ""

# Scroll animation window width (characters) for SCROLL segments.
scroll-window: 40
