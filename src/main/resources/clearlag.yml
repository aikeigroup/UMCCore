# ==========================================================================
#  UMCCore — ClearLagg (clearlag.yml)
#  Scheduled entity cleanup with countdown warnings.
#  Disable with modules.clearlag: false in config.yml.
# ==========================================================================

# Seconds between automatic cleanup passes. 300 = every 5 minutes.
interval-seconds: 300

# Countdown warnings before a cleanup, in seconds-remaining. A broadcast +
# action bar is shown at each of these marks. Warnings only appear when LESS
# THAN 60 seconds remain (marks of 60+ are ignored on purpose), so players are
# not disturbed early on long intervals.
warn-at-seconds: [30, 10, 5, 3, 2, 1]

# Which entity categories to remove. Toggle each independently.
remove:
  dropped-items: true
  hostile-mobs: false
  passive-mobs: false
  projectiles: true
  experience-orbs: false

# Never remove entities matching these protections.
protect:
  # Extra entity types to never clear (Bukkit EntityType names, lowercase),
  # e.g. [cow, pig]. Adds to the built-in default list below.
  blacklist-types: []
  # Use the built-in default blacklist of important mobs that are never cleared:
  #   villager, zombie_villager, wandering_trader   (trades)
  #   iron_golem, snow_golem, allay                 (helpers)
  #   ender_dragon, wither, elder_guardian, warden  (bosses)
  #   horse, donkey, mule, llama, trader_llama, camel, strider, happy_ghast,
  #     skeleton_horse, zombie_horse                (mounts)
  #   sniffer, creaking, shulker                    (special/valuable)
  #   fishing_bobber                                (active fishing lines)
  # Set false to manage the blacklist yourself via blacklist-types above.
  use-default-blacklist: true
  # Mobs with a name tag / custom name (does NOT protect stacked item drops).
  custom-named: true
  # Tamed pets (wolves, cats, horses, parrots...).
  tamed: true
  # Leashed mobs.
  leashed: true
  # Mobs riding a boat / minecart / another entity.
  in-vehicle: true
  # Mobs that are carrying passengers (jockeys, ridden horses, etc.).
  has-passengers: true
  # Armor stands.
  armor-stands: true
  # "Persistent" mobs — name-tagged, spawn-egg, or flagged not to despawn.
  # Also covers bred farm animals, so they survive clearlag.
  persistent: true
  # Mobs wearing/holding equipment (armour or hand items).
  equipped: true
  # Only clean entities in chunks that have no player nearby.
  playerless-chunks-only: false

# Show a live per-second action-bar countdown during the final N seconds before
# a cleanup (0 = off). Separate from the chat warn marks above.
actionbar-countdown-seconds: 10

# Message tokens: {count} = entities removed, {seconds} = time remaining.
# All messages use MiniMessage, so <bold>, <gradient:#a:#b>, <#hex>, <rainbow>,
# <italic>, etc. all work to make them eye-catching.
messages:
  # Chat warning at each warn-at-seconds mark.
  warn: "<gray>Clearing ground entities in <yellow><bold>{seconds}s</bold></yellow>...</gray>"
  # Live action-bar countdown (shown every second in the final stretch).
  actionbar: "<bold><gradient:#ff512f:#dd2476>CLEAR LAG</gradient></bold> <gray>in</gray> <bold><yellow>{seconds}s</yellow></bold>"
  # Sent in chat after a cleanup finishes.
  done: "<green>Removed <yellow><bold>{count}</bold></yellow> entities.</green>"
